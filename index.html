<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tisch-Maulwurf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: the screen is the phone lying on the desk. Four holes sit in the
   four corners, matching the four tap zones around the phone (Holo topology). */
:root {
  --oak: #c8915a;
  --oak-dark: #a8713f;
  --grain: rgba(90, 50, 20, .14);
  --hole: #2b1a10;
  --ink: #2a1708;
  --cream: #fff4e3;
  --leaf: #3f7d3a;
  --alarm: #c4392d;
  --mole: #6b4a35;
  --mole-snout: #e9a6a0;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Nunito", ui-rounded, -apple-system, system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; font-family: var(--body); color: var(--ink);
  background: var(--oak);
  background-image:
    repeating-linear-gradient(97deg, transparent 0 22px, var(--grain) 22px 24px, transparent 24px 61px),
    repeating-linear-gradient(93deg, transparent 0 140px, rgba(255,255,255,.06) 140px 150px),
    linear-gradient(180deg, var(--oak), var(--oak-dark));
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%; box-sizing: border-box; display: grid;
  grid-template-rows: 1fr auto 1fr; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
.hole {
  position: relative; display: grid; place-items: end center; min-height: 0;
  border: 0; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit;
}
.hole .pit {
  position: absolute; left: 8%; right: 8%; bottom: 14%; aspect-ratio: 2.2 / 1; max-height: 46%;
  margin-inline: auto; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 35%, #120a05 0 55%, var(--hole) 70%);
  box-shadow: inset 0 10px 18px rgba(0,0,0,.6), 0 3px 0 rgba(255,255,255,.18);
  overflow: hidden;
}
.hole .label {
  position: absolute; top: 6px; left: 0; right: 0; text-align: center;
  font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .55;
}
.hole.target .pit { outline: 4px dashed var(--cream); outline-offset: 6px; }
.hole.hit .pit { box-shadow: inset 0 10px 18px rgba(0,0,0,.6), 0 0 0 6px var(--leaf); }
.hole.wrong .pit { box-shadow: inset 0 10px 18px rgba(0,0,0,.6), 0 0 0 6px var(--alarm); }
.mole {
  position: absolute; left: 50%; bottom: -100%; width: 46%; aspect-ratio: 1 / 1.05;
  transform: translateX(-50%); transition: bottom .14s ease-out;
  background: radial-gradient(circle at 50% 30%, #876048, var(--mole) 60%);
  border-radius: 50% 50% 40% 40%;
}
.mole::before, .mole::after { /* eyes */
  content: ""; position: absolute; top: 30%; width: 11%; aspect-ratio: 1; border-radius: 50%; background: #120a05;
}
.mole::before { left: 30%; } .mole::after { right: 30%; }
.mole i { position: absolute; top: 46%; left: 50%; width: 26%; aspect-ratio: 1.4; transform: translateX(-50%);
  background: var(--mole-snout); border-radius: 50%; }
.hole.up .mole { bottom: 8%; }
.hole.bonk .mole { bottom: -100%; transition-duration: .08s; }

#center {
  justify-self: center; width: min(100%, 420px); box-sizing: border-box;
  background: var(--cream); border-radius: 22px; padding: 18px 18px 16px;
  box-shadow: 0 10px 0 rgba(60,30,10,.25), 0 20px 40px rgba(60,30,10,.25);
  display: grid; gap: 12px; text-align: center;
}
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 8vw, 36px); line-height: 1; text-wrap: balance; }
p { margin: 0; line-height: 1.4; font-size: 15px; }
.small { font-size: 13px; opacity: .75; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
button.b {
  font: 800 16px var(--body); border: 0; border-radius: 14px; padding: 12px 16px;
  background: var(--ink); color: var(--cream); cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.35);
}
button.b.alt { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
button.b:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
button:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; }
.hud { display: flex; justify-content: space-around; font-family: var(--display); font-size: 28px; font-variant-numeric: tabular-nums; }
.hud span { display: grid; }
.hud small { font: 800 11px var(--body); letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots b { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink); }
.dots b.on { background: var(--leaf); box-shadow: none; }
.meter { height: 10px; border-radius: 6px; background: rgba(42,23,8,.15); overflow: hidden; }
.meter div { height: 100%; width: 0; background: var(--leaf); transition: width .08s; }
.status { font-weight: 800; min-height: 1.4em; }
.status.err { color: var(--alarm); }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; margin-inline: auto; font-size: 12px; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 6px; text-align: center; }
th { font-weight: 800; opacity: .7; }
td { font-weight: 800; border-radius: 6px; }
td.diag { background: var(--leaf); color: var(--cream); }
td.off { background: var(--alarm); color: var(--cream); }
#center { max-height: 72vh; overflow-y: auto; }
.fld { display: grid; gap: 4px; text-align: left; font-weight: 800; font-size: 13px; }
.fld input { font: 600 16px var(--body); padding: 10px 12px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; color: var(--ink); }
.chips .b { padding: 8px 12px; font-size: 14px; }
.chips .b.sel { background: var(--ink); color: var(--cream); }
.lnk { border: 0; background: none; font: inherit; color: var(--alarm); text-decoration: underline; cursor: pointer; padding: 0; }
@media (prefers-reduced-motion: reduce) { .mole { transition: none; } }
</style>
</head>
<body>


<div id="app">
  <div class="row">
    <button class="hole" data-z="0" aria-label="Hinten links"><span class="label">hinten links</span><span class="pit"><span class="mole"><i></i></span></span></button>
    <button class="hole" data-z="1" aria-label="Hinten rechts"><span class="label">hinten rechts</span><span class="pit"><span class="mole"><i></i></span></span></button>
  </div>
  <div id="center"></div>
  <div class="row">
    <button class="hole" data-z="2" aria-label="Vorne links"><span class="label">vorne links</span><span class="pit"><span class="mole"><i></i></span></span></button>
    <button class="hole" data-z="3" aria-label="Vorne rechts"><span class="label">vorne rechts</span><span class="pit"><span class="mole"><i></i></span></span></button>
  </div>
</div>

<script src="engine.js"></script>
<script src="app.js"></script>

</body>
</html>
